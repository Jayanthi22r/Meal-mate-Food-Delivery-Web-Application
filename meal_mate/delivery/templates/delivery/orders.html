<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Georgia', serif;
            background: linear-gradient(to right, #f8f5f0, #e8dfd1);
            color: #333;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            color: #5cb85c;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #555;
            margin-bottom: 25px;
        }

        .address-box {
            background: #f9f4ee;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            color: #5c3d2e;
            font-weight: bold;
        }

        h3 {
            color: #8b5e3c;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        th {
            background: #8b5e3c;
            color: white;
            padding: 14px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f9f4ee;
        }

        .total {
            font-size: 24px;
            color: #5c3d2e;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .home-btn {
            display: inline-block;
            text-decoration: none;
            background: #5cb85c;
            color: white;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .home-btn:hover {
            background: #449d44;
        }

        .delivery-note {
            color: gray;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="success-icon">✅</div>

        <h1>Thank You, {{ username }}!</h1>

        <p>Your order has been placed successfully.</p>

        <div class="address-box">
            Delivery Address: {{ address }}
        </div>

        <h3>Order Summary</h3>

        <table>
            <tr>
                <th>Food Item</th>
                <th>Price ($)</th>
            </tr>

            {% for item in cart_items %}
            <tr>
                <td>{{ item.name }}</td>
                <td>${{ item.price }}</td>
            </tr>
            {% endfor %}
        </table>

        <div class="total">
            Total Paid: ${{ total_price }}
        </div>

        <a href="/" class="home-btn">Go to Home</a>

        <p class="delivery-note">
            🚚 Your order will be delivered shortly
        </p>
    </div>

</body>
</html>
