<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Meal Mate</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            background: linear-gradient(to right, #f8f5f0, #e8dfd1);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 420px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            text-align: center;
            border-top: 6px solid #8b5e3c;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h2 {
            color: #5c3d2e;
            margin-bottom: 10px;
            font-size: 30px;
        }

        p {
            color: #777;
            margin-bottom: 30px;
            font-size: 16px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            color: #5c3d2e;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #8b5e3c;
            box-shadow: 0 0 5px rgba(139,94,60,0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #5cb85c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #449d44;
        }

        .signup-link {
            margin-top: 20px;
            display: block;
            color: #8b5e3c;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-link:hover {
            color: #5c3d2e;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🔐</div>

        <h2>Sign In</h2>
        <p>Login to continue ordering your favorite meals</p>

        <form method="POST" action="{% url 'handle_login' %}">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username" placeholder="Enter username" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>

            <button type="submit">Sign In</button>
        </form>

        <a href="/signup/" class="signup-link">
            Don't have an account? Sign Up
        </a>
    </div>

</body>
</html>
