<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Failed</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            background: linear-gradient(to right, #f8f5f0, #e8dfd1);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .error-container {
            background: white;
            width: 420px;
            padding: 40px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border-top: 6px solid #d9534f;
        }

        h1 {
            color: #d9534f;
            margin-bottom: 15px;
            font-size: 32px;
        }

        p {
            color: #555;
            font-size: 18px;
            margin-bottom: 25px;
        }

        .retry-btn {
            display: inline-block;
            text-decoration: none;
            background: #8b5e3c;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .retry-btn:hover {
            background: #6f472d;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="icon">❌</div>
        <h1>Login Failed</h1>
        <p>Invalid username or password. Please try again.</p>

        <a href="/" class="retry-btn">Try Again</a>
    </div>

</body>
</html>
