<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Restaurant</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            background: linear-gradient(to right, #f8f5f0, #e8dfd1);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 480px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border-top: 6px solid #8b5e3c;
        }

        h2 {
            text-align: center;
            color: #5c3d2e;
            margin-bottom: 25px;
            font-size: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #5c3d2e;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #8b5e3c;
            box-shadow: 0 0 5px rgba(139,94,60,0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #8b5e3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #6f472d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Update Restaurant</h2>

        <form method="POST" action="{% url 'update_restaurant' restaurant.id %}">
            {% csrf_token %}
            
            <label>Restaurant Name</label>
            <input type="text"
                   name="name"
                   value="{{ restaurant.name }}"
                   required>

            <label>Picture URL</label>
            <input type="url"
                   name="picture"
                   value="{{ restaurant.picture }}"
                   required>

            <label>Cuisine</label>
            <input type="text"
                   name="cuisine"
                   value="{{ restaurant.cuisine }}"
                   required>

            <label>Rating</label>
            <input type="number"
                   name="rating"
                   step="0.1"
                   min="0"
                   max="5"
                   value="{{ restaurant.rating }}"
                   required>

            <button type="submit">Update Restaurant</button>
        </form>
    </div>

</body>
</html>
