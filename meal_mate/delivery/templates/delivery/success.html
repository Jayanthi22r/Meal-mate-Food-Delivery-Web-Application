<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Meal Mate</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            background: linear-gradient(to right, #f8f5f0, #e8dfd1);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 500px;
            padding: 45px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border-top: 6px solid #5cb85c;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            color: #5cb85c;
            margin-bottom: 10px;
            font-size: 34px;
        }

        p {
            color: #666;
            font-size: 17px;
            margin-bottom: 30px;
        }

        .btn {
            display: block;
            text-decoration: none;
            padding: 14px;
            margin: 15px 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .add-btn {
            background: #d4a017;
            color: white;
        }

        .add-btn:hover {
            background: #b8860b;
        }

        .show-btn {
            background: #5cb85c;
            color: white;
        }

        .show-btn:hover {
            background: #449d44;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">✅</div>

        <h1>Login Successful</h1>
        <p>Welcome to your Meal-Mate restaurant dashboard</p>

        <a href="restaurant_page/" class="btn add-btn">
            Add New Restaurant
        </a>

        <a href="show_restaurant_page/" class="btn show-btn">
            Show All Restaurants
        </a>
    </div>

</body>
</html>
