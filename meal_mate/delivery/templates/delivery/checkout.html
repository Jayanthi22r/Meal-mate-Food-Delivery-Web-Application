<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Georgia', serif;
            background: linear-gradient(to right, #f8f5f0, #e8dfd1);
            color: #333;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #5c3d2e;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #8b5e3c;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        th {
            background: #8b5e3c;
            color: white;
            padding: 14px;
            font-size: 16px;
        }

        td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f9f4ee;
        }

        .total {
            text-align: right;
            font-size: 22px;
            color: #5c3d2e;
            margin-bottom: 25px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #5cb85c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #449d44;
        }

        .error-box {
            background: #ffe5e5;
            color: #d9534f;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
        }

        .secure-text {
            text-align: center;
            color: gray;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Checkout</h1>
        <h2>Welcome, {{ username }}</h2>

        {% if error %}
            <div class="error-box">
                {{ error }}
            </div>
        {% else %}

        <table>
            <thead>
                <tr>
                    <th>Food Item</th>
                    <th>Price ($)</th>
                </tr>
            </thead>
            <tbody>
                {% for item in cart_items %}
                <tr>
                    <td>{{ item.name }}</td>
                    <td>${{ item.price }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <h3 class="total">Total Price: ${{ total_price }}</h3>

        <form method="POST" action="{% url 'orders' username %}">
            {% csrf_token %}
            <button type="submit" class="btn">Place Order</button>
        </form>

        <p class="secure-text">🔒 Safe and secure checkout</p>

        {% endif %}
    </div>

</body>
</html>
