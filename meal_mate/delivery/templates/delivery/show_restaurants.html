<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Restaurants</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Georgia', serif;
            background: linear-gradient(to right, #f8f5f0, #e8dfd1);
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #5c3d2e;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #8b5e3c;
            color: white;
            padding: 15px;
            font-size: 16px;
        }

        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f9f4ee;
        }

        img {
            width: 110px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .rating {
            color: #d4a017;
            font-weight: bold;
            font-size: 17px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            margin: 5px 0;
            transition: 0.3s;
        }

        .menu-btn {
            background: #5cb85c;
            color: white;
        }

        .menu-btn:hover {
            background: #449d44;
        }

        .update-btn {
            background: #d4a017;
            color: white;
        }

        .update-btn:hover {
            background: #b8860b;
        }

        .delete-btn {
            background: #d9534f;
            color: white;
            border: none;
            cursor: pointer;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 5px;
        }

        .delete-btn:hover {
            background: #c9302c;
        }

        .empty-msg {
            text-align: center;
            font-size: 20px;
            color: #8b5e3c;
            padding: 25px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My Favourite Restaurants</h1>

        {% if restaurants %}
        <table>
            <thead>
                <tr>
                    <th>Picture</th>
                    <th>Name</th>
                    <th>Cuisine</th>
                    <th>Rating</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                {% for restaurant in restaurants %}
                <tr>
                    <td>
                        <img src="{{ restaurant.picture }}"
                             alt="Picture of {{ restaurant.name }}">
                    </td>

                    <td>{{ restaurant.name }}</td>
                    <td>{{ restaurant.cuisine }}</td>
                    <td class="rating">⭐ {{ restaurant.rating }}/5</td>

                    <td>
                        <a href="{% url 'restaurant_menu' restaurant.id %}"
                           class="btn menu-btn">
                           View Menu
                        </a>
                        <br>

                        <a href="{% url 'update_restaurant_page' restaurant.id %}"
                           class="btn update-btn">
                           Update Info
                        </a>

                        <form method="POST"
                              action="{% url 'delete_restaurant' restaurant.id %}">
                            {% csrf_token %}
                            <button type="submit"
                                    class="delete-btn"
                                    onclick="return confirm('Are you sure you want to delete this restaurant?')">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        {% else %}
            <p class="empty-msg">No restaurants added yet 🍽️</p>
        {% endif %}
    </div>

</body>
</html>
